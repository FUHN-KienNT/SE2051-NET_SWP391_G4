# LearnHub PostgreSQL Database Configuration
db.driver=org.postgresql.Driver
db.url=jdbc:postgresql://localhost:5432/learnhub_db?stringtype=unspecified
db.username=postgres
db.password=sa

# HikariCP Connection Pool Settings
hikaricp.maximumPoolSize=10
hikaricp.minimumIdle=2
hikaricp.idleTimeout=30000
hikaricp.connectionTimeout=20000
hikaricp.maxLifetime=1800000

# Cloudinary API Configuration
cloudinary.cloud_name=learnhub_demo
cloudinary.api_key=123456789012345
cloudinary.api_secret=your_cloudinary_api_secret

# VNPay Payment Gateway Configuration
vnpay.tmn_code=LEARNHUB01
vnpay.hash_secret=LEARNHUBSECRETKEY2026VNPAYSANDBOX
vnpay.pay_url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return_url=http://localhost:8080/learnhub/payment/result

# SMTP is configured through the Tomcat process environment; see README.md.
